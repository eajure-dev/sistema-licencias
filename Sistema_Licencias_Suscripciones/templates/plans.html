{% extends "base.html" %}{% block content %}<h1>Planes y precios</h1><form method="post" class="form compact"><input name="name" placeholder="Nombre del plan" required><input name="price" type="number" placeholder="Precio CLP" required><input name="duration" type="number" value="30" placeholder="Días" required><input name="machines" type="number" value="1" placeholder="Equipos" required><input name="features" placeholder="Funciones incluidas"><label><input type="checkbox" name="updates" checked> Actualizaciones</label><button>Crear plan</button></form><table><tr><th>Plan</th><th>Precio</th><th>Días</th><th>Equipos</th><th>Updates</th></tr>{% for p in plans %}<tr><td>{{p.name}}</td><td>${{p.price}}</td><td>{{p.duration_days}}</td><td>{{p.machines}}</td><td>{{'Sí' if p.updates else 'No'}}</td></tr>{% endfor %}</table>{% endblock %}
