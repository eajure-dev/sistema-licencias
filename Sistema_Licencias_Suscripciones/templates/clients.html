{% extends "base.html" %}{% block content %}<h1>Clientes</h1><table><tr><th>Negocio</th><th>Correo</th><th>Plan</th><th>Estado</th><th>Vence</th><th></th></tr>{% for c in clients %}<tr><td>{{c.business or c.name}}</td><td>{{c.email}}</td><td>{{c.plan}}</td><td>{{c.status}}</td><td>{{c.expires_at}}</td><td>{% if c.license_id %}<a href="{{url_for('admin_license',license_id=c.license_id)}}">Editar</a>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
